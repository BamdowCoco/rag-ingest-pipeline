# 项目配置（运行依赖在 requirements.txt，见下）
[project]
name = "rag-ingest-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
# 运行依赖只在 requirements.txt 里维护 —— 那是唯一被读取的地方
# （Dockerfile 的 pip install -r，以及 README「本地开发」里的同一条命令）。
# 这里不再重复列一份，免得改依赖时要同步两个文件。

[project.optional-dependencies]
dev = [
  "pytest>=8",
#  "pytest-asyncio>=0.23",
  "httpx>=0.28.1",
#  "aiosqlite>=0.20",
#  "fakeredis>=2.23",
]