# Alembic 配置。用法：
#   docker compose exec api alembic upgrade head       # 升到最新
#   docker compose exec api alembic revision --autogenerate -m "说明"   # 生成新迁移
#
# 【DSN 不写在这里】`alembic/env.py` 从 `app.core.config.settings` 取 ——
# 这样「迁移用的库」和「应用用的库」永远是同一个，环境变量切库时不会错位。
[alembic]
# %(here)s = 本文件所在目录 —— 这样不管从哪个 CWD 跑都对
script_location = %(here)s/alembic
# 让 alembic 能 import app（它要从 settings / Base 取东西）
prepend_sys_path = .
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
